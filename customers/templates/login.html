{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Вход в систему</title>
</head>
<body>
    <div class="auth-card">
        <div class="header">
            <a class="back-link" href="#" onclick="history.back(); return false;">
                <img class="back-icon" src="https://cdn-icons-png.flaticon.com/128/271/271218.png" alt="иконка назад" title="Назад">
            </a>
            <h1>Авторизация</h1>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="form-container">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn-submit" type="submit">Войти</button>
            </form>
        </div>
        <p class="auth-footer">Нет аккаунта? <a href="{% url 'register' %}">Создать аккаунт</a></p>
    </div>
</body>
</html>
