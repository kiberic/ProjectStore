{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/wallet_deposit.css' %}">
    <title>Пополнение баланса</title>
</head>
<body>
    <div class="deposit-container">
        <div class="header">
            <a class="back-link" href="#" onclick="history.back(); return false;">
                <img class="back-icon" src="https://flaticon.com" alt="Назад" title="Назад">
            </a>
            <h1>Пополнение счета</h1>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="info-alert">
            💡 Минимальная сумма единовременного пополнения кошелька составляет 1.00 ₽.
        </div>

        <div class="form-wrapper">
            <form method="post" action="{% url 'deposit_wallet' %}">
                {% csrf_token %}
                
                <!-- Рендерим поле ввода суммы из DepositForm -->
                <div class="form-field-group">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="btn-submit-deposit">Подтвердить платеж</button>
            </form>
        </div>
    </div>
</body>
</html>
